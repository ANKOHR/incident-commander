[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-commander"
version = "1.0.0"
description = "A deterministic, heuristic analyzer for fictional incident data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
incident-commander = "incident_commander.cli:main"

[tool.setuptools.packages.find]
include = ["incident_commander*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
